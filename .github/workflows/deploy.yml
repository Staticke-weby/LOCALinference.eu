name: Build EN from CZ source

# EN zdroj zůstává v repu LOCALinference.cz. Tento repo obsahuje jen
# workflow a CNAME; žádný cross-repo token. Workflow si stáhne veřejný
# .cz repo, postaví sites/eu a nasadí výstup na vlastní Pages.
#
# Hodinový cron je jen pojistka: než se cokoli postaví, workflow zjistí
# HEAD .cz a porovná ho s posledním nasazeným SHA. Když se nic nezměnilo,
# build i deploy se přeskočí. Ruční spuštění (workflow_dispatch) stav
# ignoruje a nasadí vždy.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages-eu
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.cz.outputs.sha }}
    steps:
      - name: CZ HEAD
        id: cz
        run: |
          sha="$(git ls-remote https://github.com/Staticke-weby/LOCALinference.cz refs/heads/main | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CZ main: $sha"

      - name: Restore last deployed SHA
        uses: actions/cache/restore@v4
        with:
          path: .cz-sha
          key: cz-sha-${{ steps.cz.outputs.sha }}
          restore-keys: |
            cz-sha-

      - name: Compare
        id: cmp
        run: |
          prev="$(cat .cz-sha 2>/dev/null || true)"
          echo "previous=$prev current=${{ steps.cz.outputs.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$prev" != "${{ steps.cz.outputs.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CZ source
        uses: actions/checkout@v5
        with:
          repository: Staticke-weby/LOCALinference.cz
          path: src

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci
        working-directory: src

      - run: npm ci
        working-directory: src/sites/eu

      - name: Build EN
        working-directory: src/sites/eu
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/sites/eu/dist

  deploy:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

      - name: Record deployed CZ SHA
        if: success()
        run: echo "${{ needs.check.outputs.sha }}" > .cz-sha

      - name: Save deployed SHA
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .cz-sha
          key: cz-sha-${{ needs.check.outputs.sha }}
